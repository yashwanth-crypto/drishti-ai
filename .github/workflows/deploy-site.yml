name: Deploy site to GitHub Pages

# Publishes two things to Pages:
#   /       the static landing page in site/
#   /demo/  the dashboard, built from dashboard/
#
# The dashboard authenticates against a backend that Pages cannot host, so the
# published build detects that nothing answers /api and falls back to the
# recorded results in events.json, with a banner saying so. The same bundle
# talks to the real backend when one is there, so there is no second cut of the
# app to keep in step.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: dashboard

      - name: Build dashboard
        run: npm run build
        working-directory: dashboard

      - name: Assemble the site
        run: |
          mkdir -p site/demo
          cp -r dashboard/dist/* site/demo/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
