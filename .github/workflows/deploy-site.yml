name: Deploy site to GitHub Pages

# Publishes the static landing page in site/ to GitHub Pages.
#
# This replaced a workflow that published the dashboard itself. That made sense
# while the dashboard read a checked-in JSON file, but it now authenticates
# against a backend, so deploying it to Pages would put up a login screen that
# can never succeed. The dashboard is demonstrated live instead, from a machine
# actually running the stack.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
